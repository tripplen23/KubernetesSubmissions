apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app
  labels:
    app: todo-app
  annotations:
    # Force Traefik to route via entrypoint 'web' (port 80/8000).
    # Without this, k3d's Traefik binds the rule to 'websecure'
    # (port 8443), which the k3d port mapping doesn't expose → 404.
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-app
                port:
                  number: 3000
