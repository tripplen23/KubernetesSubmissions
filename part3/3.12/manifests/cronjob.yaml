apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-cron
  namespace: project
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: todo-cron
              image: TODO_CRON
              imagePullPolicy: Always
              env:
                - name: TODO_BACKEND_URL
                  value: "http://todo-backend-svc:2345"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi