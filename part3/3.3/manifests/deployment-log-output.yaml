apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  labels:
    app: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-logs
          emptyDir: {}
      containers:
        - name: writer
          image: gcr.io/dwk-gke-506208/log-output:3.3
          imagePullPolicy: Always
          env:
            - name: ROLE
              value: "writer"
            - name: FILE_PATH
              value: "/usr/src/app/files/timestamp.txt"
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
        - name: reader
          image: gcr.io/dwk-gke-506208/log-output:3.3
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: ROLE
              value: "reader"
            - name: PORT
              value: "3000"
            - name: FILE_PATH
              value: "/usr/src/app/files/timestamp.txt"
            - name: PINGS_URL
              value: "http://ping-pong-svc:3000/pongs"
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files