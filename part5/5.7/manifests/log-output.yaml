apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
  labels:
    app: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-logs
          emptyDir: {}
        - name: config-volume
          configMap:
            name: log-output-config
      containers:
        - name: writer
          image: dev.local/log-output:5.7
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: "writer"
            - name: FILE_PATH
              value: "/usr/src/app/files/timestamp.txt"
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
        - name: reader
          image: dev.local/log-output:5.7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: ROLE
              value: "reader"
            - name: PORT
              value: "3000"
            - name: FILE_PATH
              value: "/usr/src/app/files/timestamp.txt"
            # Ping pong is a Knative Service now, so it is addressed by its
            # fully qualified Service name instead of a plain Service name.
            - name: PINGS_URL
              value: "http://pingpong.exercises.svc.cluster.local/pongs"
            - name: INFO_FILE
              value: "/usr/src/app/config/information.txt"
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
            - name: config-volume
              mountPath: /usr/src/app/config
---
apiVersion: v1
kind: Service
metadata:
  name: log-output-svc
  namespace: exercises
  labels:
    app: log-output
spec:
  type: ClusterIP
  selector:
    app: log-output
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
